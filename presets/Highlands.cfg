## Riverheim Config preset: Highlands
## Big mountain ranges, steeper land and sharper cliffs.
## Copy over BepInEx/config/com.valheim.riverheim.config.cfg, or load it with the AtlasBuilder UI's Import config.
## Settings not listed stay at Riverheim's own values.

[1. World]
MountainHeight = 40

[8. Mountains]
MountainScoreThreshold = 0.4
MountainMinPatchSize = 60
MountainAreaScore = 0.06
MountainSelectionRandomness = 15
MountainEdgeTrim = 10

[11. Terrain]
LandSlope = 1.5
FlatlandThreshold = 0.15
CliffIntensity = 10
CliffTerraceHeight = 50
